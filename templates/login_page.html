{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block body_class %}app-shell auth-page{% endblock %}
{% block content %}
  <div class="auth-panel">
    <h1>Вхід</h1>
    <form method="post" class="form-stack" action="">
      {% csrf_token %}
      <div class="field">
        <label for="id_email">Електронна пошта</label>
        <input id="id_email" type="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="id_password">Пароль</label>
        <input id="id_password" type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Увійти</button>
    </form>
    <p class="auth-footer-link">Не маєте акаунту? <a href="{% url 'registration' %}">Реєстрація</a></p>
  </div>
{% endblock %}
