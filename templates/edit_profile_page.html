{% extends "base.html" %}
{% block title %}Редагування профілю{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>Редагувати профіль</h1>
    <p>Оновіть email; пароль змінюйте лише за потреби</p>
  </div>

  <div class="card profile-card">
    <form method="post" class="form-stack" action="">
      {% csrf_token %}
      <div class="field">
        <label for="id_email">Електронна пошта</label>
        <input id="id_email" type="email" name="email" required value="{{ user.email }}">
      </div>
      <div class="field">
        <label for="id_password">Новий пароль</label>
        <input id="id_password" type="password" name="password" autocomplete="new-password" placeholder="Залиште порожнім, щоб не змінювати">
        <p class="hint">Якщо поле порожнє, пароль залишиться без змін.</p>
      </div>
      <button type="submit" class="btn">Зберегти зміни</button>
    </form>
  </div>
{% endblock %}
