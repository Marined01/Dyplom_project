{% extends "base.html" %}
{% block title %}Передача ключа{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>Передати ключ</h1>
    <p>Аудиторія <strong>{{ key.auditory }}</strong> — вкажіть ім’я та прізвище отримувача зареєстрованого в системі</p>
  </div>

  <div class="card profile-card">
    <form method="post" class="form-stack" action="">
      {% csrf_token %}
      <div class="field">
        <label for="id_name">Ім’я</label>
        <input id="id_name" type="text" name="name" required autocomplete="given-name">
      </div>
      <div class="field">
        <label for="id_surname">Прізвище</label>
        <input id="id_surname" type="text" name="surname" required autocomplete="family-name">
      </div>
      <button type="submit" class="btn">Надіслати запит на передачу</button>
      <div class="form-actions-row">
        <a href="{% url 'home' %}" class="btn btn--secondary">Скасувати</a>
      </div>
    </form>
  </div>
{% endblock %}
