{% extends "base.html" %}
{% block title %}Профіль{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>Профіль</h1>
    <p>Ваші дані в системі</p>
  </div>

  <div class="card profile-card">
    <div class="card__body profile-info">
      <p><strong>Ім’я:</strong> {{ user.name }}</p>
      <p><strong>Прізвище:</strong> {{ user.surname }}</p>
      <p><strong>Електронна пошта:</strong> {{ user.email }}</p>
    </div>
    <div class="card__actions">
      <a href="{% url 'profile_edit' %}" class="btn">Редагувати профіль</a>
    </div>
  </div>
{% endblock %}
